name: Atualizar contribuições

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests feedparser
      - run: python update.py
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add contributions
          git diff --cached --quiet || (git commit -m "Atualiza contribuições" && git pull --rebase && git push)
